<html>
  <head>
    <title>Working directory</title>

    <script type="module">
      import { store } from "/components/settings/settings-store.js";
      import { store as fileBrowserStore } from "/components/modals/file-browser/file-browser-store.js";
    </script>
  </head>

  <body>
    <div x-data data-i18n-scope="settings">
      <template x-if="$store.settings?.settings">
        <div>
          <div class="section-title" data-i18n="Default working directory">Default working directory</div>
          <div class="section-description" data-i18n="The fallback workspace for chats that are not attached to a project.">
            The fallback workspace for chats that are not attached to a project.
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title" data-i18n="Workdir path">Workdir path</div>
              <div class="field-description"><span data-i18n="Use a Linux path inside the container, for example">Use a Linux path inside the container, for example</span> <code>/a0/usr/workdir</code>.</div>
            </div>
            <div class="field-control">
              <input type="text" x-model="$store.settings.settings.workdir_path" />
              <button class="btn btn-field settings-inline-button" @click="$store.fileBrowser.open($store.settings.settings.workdir_path)" data-i18n="Browse">Browse</button>
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title" data-i18n="Remember last file browser location">Remember last file browser location</div>
              <div class="field-description" data-i18n="Open the file browser at the most recently visited directory when no specific path is requested.">
                Open the file browser at the most recently visited directory when no specific path is requested.
              </div>
            </div>
            <div class="field-control">
              <label class="toggle">
                <input type="checkbox" x-model="$store.settings.settings.file_browser_remember_last_directory" />
                <span class="toggler"></span>
              </label>
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title" data-i18n="Show workdir structure to the agent">Show workdir structure to the agent</div>
              <div class="field-description" data-i18n="Give the agent a compact map of the workspace at the start of a task.">
                Give the agent a compact map of the workspace at the start of a task.
              </div>
            </div>
            <div class="field-control">
              <label class="toggle">
                <input type="checkbox" x-model="$store.settings.settings.workdir_show" />
                <span class="toggler"></span>
              </label>
            </div>
          </div>

          <template x-if="$store.settings.settings.workdir_show">
            <div class="settings-advanced-section" x-data="{ advOpen: false }">
              <button type="button" class="settings-advanced-toggle" @click="advOpen = !advOpen">
                <span class="material-symbols-outlined settings-advanced-toggle-icon"
                      :style="advOpen ? 'transform:rotate(90deg)' : ''">chevron_right</span>
                <span data-i18n="Advanced Settings">Advanced Settings</span>
              </button>

              <div class="settings-advanced-body" x-show="advOpen" x-transition.opacity>
                <div class="field">
                  <div class="field-label">
                    <div class="field-title" data-i18n="Depth limit">Depth limit</div>
                    <div class="field-description" data-i18n="How many folder levels to include. Use 0 for no depth limit.">How many folder levels to include. Use 0 for no depth limit.</div>
                  </div>
                  <div class="field-control">
                    <input type="number" x-model.number="$store.settings.settings.workdir_max_depth" min="0" step="1" />
                  </div>
                </div>

                <div class="field">
                  <div class="field-label">
                    <div class="field-title" data-i18n="Line budget">Line budget</div>
                    <div class="field-description" data-i18n="Maximum lines shown to the agent. Use 0 for no line limit.">Maximum lines shown to the agent. Use 0 for no line limit.</div>
                  </div>
                  <div class="field-control">
                    <input type="number" x-model.number="$store.settings.settings.workdir_max_lines" min="0" step="1" />
                  </div>
                </div>

                <div class="field">
                  <div class="field-label">
                    <div class="field-title" data-i18n="Folder limit">Folder limit</div>
                    <div class="field-description" data-i18n="Maximum subfolders shown per folder. Use 0 for no folder limit.">Maximum subfolders shown per folder. Use 0 for no folder limit.</div>
                  </div>
                  <div class="field-control">
                    <input type="number" x-model.number="$store.settings.settings.workdir_max_folders" min="0" step="1" />
                  </div>
                </div>

                <div class="field">
                  <div class="field-label">
                    <div class="field-title" data-i18n="File limit">File limit</div>
                    <div class="field-description" data-i18n="Maximum files shown per folder. Use 0 for no file limit.">Maximum files shown per folder. Use 0 for no file limit.</div>
                  </div>
                  <div class="field-control">
                    <input type="number" x-model.number="$store.settings.settings.workdir_max_files" min="0" step="1" />
                  </div>
                </div>

                <div class="field field-full">
                  <div class="field-label">
                    <div class="field-title" data-i18n="Ignored files and folders">Ignored files and folders</div>
                    <div class="field-description" data-i18n="Gitignore-style patterns that should stay out of the agent’s workspace map.">Gitignore-style patterns that should stay out of the agent’s workspace map.</div>
                  </div>
                  <div class="field-control">
                    <textarea x-model="$store.settings.settings.workdir_gitignore" rows="5" placeholder="node_modules/&#10;.git/&#10;*.log"></textarea>
                  </div>
                </div>

                <div class="field">
                  <div class="field-label">
                    <div class="field-title" data-i18n="Preview workspace map">Preview workspace map</div>
                    <div class="field-description" data-i18n="See exactly what the agent will receive before saving the limits.">See exactly what the agent will receive before saving the limits.</div>
                  </div>
                  <div class="field-control">
                    <button class="btn btn-field" @click="$store.settings.testWorkdirFileStructure()" data-i18n="Preview">Preview</button>
                  </div>
                </div>
              </div>
            </div>
          </template>
        </div>
      </template>
    </div>
  </body>
</html>
